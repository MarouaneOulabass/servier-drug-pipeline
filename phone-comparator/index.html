<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneVS - Comparateur Premium</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
        <canvas id="particleCanvas"></canvas>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
                        <rect x="8" y="3" width="20" height="30" rx="4" stroke="url(#logoGrad)" stroke-width="2.5"/>
                        <circle cx="18" cy="28" r="2" fill="url(#logoGrad)"/>
                        <line x1="12" y1="7" x2="24" y2="7" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="8" y1="3" x2="28" y2="33">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#a855f7"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-title">Phone<span class="logo-accent">VS</span></span>
                </div>
            </div>
            <div class="header-actions">
                <label class="upload-btn" id="uploadBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <polyline points="9 15 12 12 15 15"/>
                    </svg>
                    Charger Excel
                    <input type="file" id="excelInput" accept=".xlsx,.xls" hidden>
                </label>
                <button class="clear-btn" id="clearBtn" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="main-content">

        <!-- Welcome Screen -->
        <section class="welcome-screen" id="welcomeScreen">
            <div class="welcome-card">
                <div class="welcome-icon-wrap">
                    <div class="welcome-ring"></div>
                    <div class="welcome-ring ring-2"></div>
                    <div class="welcome-icon">
                        <svg width="56" height="56" viewBox="0 0 80 80" fill="none">
                            <rect x="20" y="8" width="40" height="64" rx="8" stroke="white" stroke-width="2.5" opacity="0.9"/>
                            <circle cx="40" cy="60" r="3" fill="white" opacity="0.7"/>
                            <rect x="26" y="16" width="28" height="36" rx="3" fill="white" opacity="0.08"/>
                            <path d="M34 34L38 38L46 30" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                        </svg>
                    </div>
                </div>
                <h1>Trouvez le <span class="gradient-text">smartphone parfait</span></h1>
                <p>Comparez les caractéristiques côte à côte pour faire le meilleur choix.</p>
                <div class="welcome-actions">
                    <label class="welcome-upload-btn" for="excelInput">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Importer le catalogue
                    </label>
                    <a class="download-sample-btn" href="phones_catalog.xlsx" download>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Fichier de démo
                    </a>
                </div>
            </div>
        </section>

        <!-- Phone Selection Grid -->
        <section class="phone-catalog" id="phoneCatalog" style="display:none;">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>Sélectionnez vos téléphones</h2>
                    <p class="section-subtitle" id="catalogSubtitle">Cliquez pour ajouter à la comparaison</p>
                </div>
                <div class="catalog-controls">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Rechercher...">
                    </div>
                    <div class="filter-chips" id="brandFilters"></div>
                </div>
            </div>
            <div class="phone-grid" id="phoneGrid"></div>
        </section>

        <!-- Comparison Table -->
        <section class="comparison-section" id="comparisonSection" style="display:none;">
            <div class="comparison-header-bar">
                <button class="back-to-catalog" id="backToCatalog">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Catalogue
                </button>
                <h2 class="comparison-title">Comparaison</h2>
                <span class="comparison-count" id="comparisonCount"></span>
            </div>
            <div class="comparison-wrapper">
                <div class="comparison-table-container" id="comparisonTable"></div>
            </div>
        </section>

    </main>

    <!-- Floating comparison bar -->
    <div class="floating-bar" id="floatingBar" style="display:none;">
        <div class="floating-bar-content">
            <div class="floating-phones" id="floatingPhones"></div>
            <button class="compare-btn" id="compareBtn">
                Comparer
                <span class="compare-count-badge" id="selectedCount">0</span>
            </button>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
